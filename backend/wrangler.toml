name = "research-lab-stats"
main = "worker.js"
compatibility_date = "2026-10-30"

[vars]
SITE_ORIGIN = "https://diginto112.github.io"

[[d1_databases]]
binding = "DB"
database_name = "research-lab-stats"
# Replace with the ID printed by `wrangler d1 create research-lab-stats`.
database_id = "401dccf3-343c-486d-9d0d-a28e3346e595"
